development:
  prune_ai_effects:
    class: PruneAiEffectsJob
    queue: maintenance
    schedule: at 3:17am every day
  run_due_automation_rules:
    class: RunDueAutomationRulesJob
    queue: default
    schedule: every minute
  run_due_reminders:
    class: RunDueRemindersJob
    queue: default
    schedule: every minute

production:
  prune_ai_effects:
    class: PruneAiEffectsJob
    queue: maintenance
    schedule: at 3:17am every day
  run_due_automation_rules:
    class: RunDueAutomationRulesJob
    queue: default
    schedule: every minute
  run_due_reminders:
    class: RunDueRemindersJob
    queue: default
    schedule: every minute

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
